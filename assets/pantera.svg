<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="506" viewBox="0 0 1200 506" role="img" aria-label="Pantera al Acecho. Lógica del juego como máquina de estados pura (reducer), separada de la interfaz. 124 pruebas automatizadas con Vitest y Testing Library; CI en cada pull request. Reglas de seguridad en Firestore: cada docente accede solo a sus datos, validados al guardar. Carga optimizada: video a 720p, imágenes WebP, precarga y caché de recursos. Documentación de requerimientos, arquitectura y modelo de datos">
