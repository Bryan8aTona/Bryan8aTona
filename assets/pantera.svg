  <text x="64" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#f2a541">Servicio social · UAM Cuajimalpa · 2026</text>
  <text x="64" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#93a8bb">Herramienta educativa que ayuda a los docentes a enseñar de forma más fácil y dinámica:</text>
  <text x="64" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#93a8bb">convierte el repaso en un juego por equipos, con el contenido de su propia materia.</text>
