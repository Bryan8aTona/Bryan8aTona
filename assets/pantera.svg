  <text x="64" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#e8eef4">Pantera al Acecho</text>
  <rect x="966" y="50" width="170" height="36" rx="18" fill="#123d2b" stroke="#1f6b47"/>
